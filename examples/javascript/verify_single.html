<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verifier - Single Email</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .label {
            color: #666;
            font-weight: 500;
        }
        .value {
            color: #333;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.valid {
            background: #4caf50;
            color: white;
        }
        .badge.invalid {
            background: #f44336;
            color: white;
        }
        .badge.risky {
            background: #ff9800;
            color: white;
        }
        .error {
            color: #f44336;
            margin-top: 10px;
            padding: 10px;
            background: #ffebee;
            border-radius: 5px;
            border-left: 4px solid #f44336;
            display: none;
            font-size: 14px;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Email Verifier</h1>
        <p class="subtitle">Verify email addresses instantly</p>

        <form id="verifyForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>

            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="text" id="apiKey" placeholder="sk_live_..." required>
                <small style="color: #999; margin-top: 5px; display: block;">Get your API key from MyEmailVerifier dashboard</small>
            </div>

            <button type="submit">Verify Email</button>
        </form>

        <div class="loading" id="loading">Verifying email...</div>
        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-item">
                <span class="label">Email:</span>
                <span class="value" id="resultEmail"></span>
            </div>
            <div class="result-item">
                <span class="label">Status:</span>
                <span class="value" id="resultStatus"></span>
            </div>
            <div class="result-item">
                <span class="label">Deliverability:</span>
                <span class="value" id="resultDeliverability"></span>
            </div>
            <div class="result-item">
                <span class="label">Catch-all:</span>
                <span class="value" id="resultCatchall"></span>
            </div>
            <div class="result-item">
                <span class="label">Role-based:</span>
                <span class="value" id="resultRoleBased"></span>
            </div>
            <div class="result-item">
                <span class="label">Domain Valid:</span>
                <span class="value" id="resultDomainValid"></span>
            </div>
            <div class="result-item">
                <span class="label">MX Records:</span>
                <span class="value" id="resultMX"></span>
            </div>
            <div class="result-item">
                <span class="label">SMTP Check:</span>
                <span class="value" id="resultSMTP"></span>
            </div>
            <div class="result-item">
                <span class="label">Time:</span>
                <span class="value" id="resultTime"></span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('verifyForm');
        const emailInput = document.getElementById('email');
        const apiKeyInput = document.getElementById('apiKey');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const resultEl = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!email || !apiKey) {
                showError('Please fill in all fields');
                return;
            }

            try {
                showLoading(true);
                errorEl.style.display = 'none';
                resultEl.classList.remove('show');

                // Using Fast API endpoint (recommended)
                const url = `https://api.myemailverifier.com/api/validate_single.php?apikey=${encodeURIComponent(apiKey)}&email=${encodeURIComponent(email)}`;

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error('Rate limit exceeded. Please wait.');
                    } else if (response.status === 401) {
                        throw new Error('Invalid API key');
                    } else {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                }

                const data = await response.json();
                displayResult(data);
                showLoading(false);
            } catch (error) {
                showError(`Error: ${error.message}`);
                showLoading(false);
            }
        });

        function displayResult(data) {
            document.getElementById('resultEmail').textContent = data.Address;

            // Status badge
            const statusBadge = data.Status === 'Valid' ? 'valid' : 
                               data.Status === 'Invalid' ? 'invalid' : 'risky';
            document.getElementById('resultStatus').innerHTML = 
                `<span class="badge ${statusBadge}">${data.Status}</span>`;

            // Deliverability (use Status)
            document.getElementById('resultDeliverability').innerHTML =
                `<span class="badge ${statusBadge}">${data.Status}</span>`;
            
            // Boolean fields (they come as "true"/"false" strings)
            document.getElementById('resultCatchall').textContent = 
                data.catch_all === 'true' ? 'Yes' : 'No';
            document.getElementById('resultRoleBased').textContent = 
                data.Role_Based === 'true' ? 'Yes' : 'No';
            document.getElementById('resultDomainValid').textContent = 
                data.Status !== 'Invalid' ? 'Yes' : 'No';
            document.getElementById('resultMX').textContent = 
                data.Status !== 'Invalid' ? 'Yes' : 'No';
            document.getElementById('resultSMTP').textContent = 
                data.Status === 'Valid' ? 'Yes' : 'No';
            
            // Diagnosis message
            document.getElementById('resultTime').textContent = data.Diagnosis;

            resultEl.classList.add('show');
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showLoading(show) {
            loadingEl.style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
